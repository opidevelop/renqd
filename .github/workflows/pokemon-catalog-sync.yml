name: Sync Pokémon catalog

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official catalog data
        run: npm run pokemon:catalog:sync
      - name: Verify catalog integrity
        run: npm run pokemon:catalog:verify
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- public/data/pokemon/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/pokemon/catalog.json
          git commit -m "chore(pokemon): sync catalog data"
          git push origin main
